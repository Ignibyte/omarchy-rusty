[package]
name = "rusty-app"
description = "Rusty's desktop app for Omarchy: a QML shell with native agent terminals, built with cxx-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rusty"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "6"
libc = "0.2"
notify = "6"
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "process", "signal", "macros"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
