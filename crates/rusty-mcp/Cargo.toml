[package]
name = "rusty-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rusty's back end: an MCP server over stdio (local HTTP next) on top of rusty-core"

[[bin]]
name = "rusty-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusty-core = { path = "../rusty-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rmcp = { version = "3", features = ["client", "transport-child-process"] }
