# A drop-in for uwsm's compositor unit: Hyprland becomes the last of the session to go
# when memory runs out. Every app in the session sits at an OOM score of 200; 100 is the
# user manager's own score and the lowest a user unit can set, and it is enough for
# earlyoom and the kernel to pick anything else first.
#
#   install -Dm644 omarchy/wayland-wm-oom.conf \
#     ~/.config/systemd/user/wayland-wm@hyprland.desktop.service.d/60-oom.conf
#   systemctl --user daemon-reload      # takes effect at the next login
#
# Rusty's installer points at this file and does not apply it: it is another program's
# unit. The earlyoom side, which needs root, is in omarchy/README.md.
[Service]
OOMScoreAdjust=100
