name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: gate (fmt, clippy, tests, docs, shell, secrets, whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The brain vault commits to git as pages change; a runner has no identity.
      - run: |
          git config --global user.name "Rusty CI"
          git config --global user.email "ci@rusty.invalid"
      # The same gate a maintainer runs: fmt, clippy with warnings as errors, the tests
      # (crates/rusty-mcp/tests/smoke.rs drives the built server over stdio in a scratch
      # HOME), docs with warnings as errors, shell syntax, a secrets scan, whitespace.
      - run: bin/gate.sh --diff
